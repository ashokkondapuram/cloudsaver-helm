{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{- $ports := dict "api-gateway" 8000 "tenant-service" 8001 "scanner-service" 8002 "analytics-service" 8003 "notification-service" 8004 "web-dashboard" 3000 -}}

{{- $consumers := dict "api-gateway" (list "web-dashboard") "tenant-service" (list "api-gateway") "scanner-service" (list "api-gateway" "analytics-service" "notification-service") "analytics-service" (list "api-gateway") "notification-service" (list "api-gateway") -}}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}-deny-ingress
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress: []
{{- range $component, $port := $ports }}
{{- if (index $root.Values.components $component).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.name" (dict "root" $root "component" $component) }}
  labels:
    {{- include "app.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selector" (dict "root" $root "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: {{ $port }}}
      from:
        {{- if or (eq $component "web-dashboard") (eq $component "platform-portal") }}
        - {{ toYaml $root.Values.networkPolicy.ingressController | nindent 10 | trim }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $root.Chart.Name }}
              app.kubernetes.io/instance: {{ $root.Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: {{ toJson (index $consumers $component) }}

        {{- end }}
{{- end }}
{{- end }}
{{- end }}
