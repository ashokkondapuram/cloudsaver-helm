{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required" .Values.ingress.className | quote }}
  tls:
    - secretName: {{ required "ingress.tlsSecretName is required" .Values.ingress.tlsSecretName | quote }}
      hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.name" (dict "root" . "component" "platform-portal") }}
                port: {number: 3100}
{{- end }}
