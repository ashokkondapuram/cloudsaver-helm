apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-config
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  {{- $fixed := dict "PLATFORM_ENVIRONMENT" "production" "PLATFORM_PORTAL_AUTH" "entra"
    "PLATFORM_OPERATOR_TENANT_ID" .Values.entra.tenantId "PLATFORM_IDENTITY_AUDIENCE" .Values.entra.audience
    "PLATFORM_PUBLIC_URL" .Values.publicUrl "PLATFORM_PROVIDER_SCOPED_KEYS" "true"
    "PLATFORM_BILLING_ENABLED" "false" "PLATFORM_BILLING_PROVIDER" "manual" -}}
  {{- range $name, $value := mergeOverwrite (deepCopy .Values.config) $fixed }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
