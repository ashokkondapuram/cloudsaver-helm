# EXAMPLE identifiers/domains only. Contains no credentials.
# Set real immutable registry references, Entra IDs and ingress settings.
images:
  identity:
    repository: registry.example.com/zafin-platform-identity
    tag: 1.0.0
  portal:
    repository: registry.example.com/zafin-platform-portal
    tag: 1.0.0
entra:
  tenantId: 11111111-1111-4111-8111-111111111111
  clientId: 22222222-2222-4222-8222-222222222222
  audience: 33333333-3333-4333-8333-333333333333
  apiScope: api://33333333-3333-4333-8333-333333333333/access_as_user
publicUrl: https://platform.example.com
ingress:
  enabled: true
  className: nginx
  host: platform.example.com
  tlsSecretName: platform-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
networkPolicy:
  cloudsaverNamespaces:
  - cloudsaver
