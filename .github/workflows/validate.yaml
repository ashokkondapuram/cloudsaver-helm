name: Validate Helm charts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Helm and kubeconform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart-tools/bin"
          cd "$RUNNER_TEMP/chart-tools"
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.17.4-linux-amd64.tar.gz -o helm.tar.gz
          echo 'c91e3d7293849eff3b4dc4ea7994c338bcc92f914864d38b5789bab18a1d775d  helm.tar.gz' | sha256sum --check
          tar -xzf helm.tar.gz linux-amd64/helm
          mv linux-amd64/helm bin/helm
          curl --fail --silent --show-error --location https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          echo '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz' | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
          mv kubeconform bin/kubeconform
          echo "$RUNNER_TEMP/chart-tools/bin" >> "$GITHUB_PATH"
          echo "KUBECONFORM=$RUNNER_TEMP/chart-tools/bin/kubeconform" >> "$GITHUB_ENV"
      - run: python -m pip install PyYAML==6.0.3
      - name: Lint, render contracts and strict Kubernetes schemas
        run: python scripts/test_charts.py
      - name: Package both charts
        run: make package
